name: Verify proprietary files against the official Xiaomi OTA

on:
  workflow_dispatch:
  push:
    branches: ['bringup/**']
    paths:
      - proprietary-files.txt
      - proprietary/**
      - tests/test_proprietary_files.py
      - tools/ota_payload.py
      - tools/extract_proprietary.py
      - .github/workflows/proprietary-verify.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Unit tests of the list and the extraction tool
        run: python3 -m unittest discover -s tests -p 'test_proprietary_files.py' -v
      - name: Install EROFS tools
        run: sudo apt-get install -y -q erofs-utils
      - name: Reproduce the vendor partition and check every listed file
        # Only this repository's list: the mondrian list is verified by the
        # mondrian repository itself, so the result of a commit here never
        # depends on later changes in another repository.
        run: |
          set -euo pipefail
          python3 tools/extract_proprietary.py --verify-only --work "$RUNNER_TEMP" \
            --list "proprietary-files.txt=$RUNNER_TEMP/out/sm8450-common"
          echo "[PASS] Every sm8450-common file matches the official OTA OS3.0.8.0.VMNCNXM" >> "$GITHUB_STEP_SUMMARY"
